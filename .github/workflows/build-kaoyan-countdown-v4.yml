name: Build Kaoyan Countdown V4
on:
  push:
    branches: [build-kaoyan-countdown-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 -m pip install pillow
      - name: Create Android project
        shell: bash
        run: |
          set -e
          rm -rf android-v4
          mkdir -p android-v4/app/src/main/java/com/wxy/kaoyancountdown android-v4/app/src/main/assets
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android-v4/app/src/main/res/mipmap-$d; done
          cat > android-v4/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='KaoyanCountdown'; include ':app'
          EOF
          cat > android-v4/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > android-v4/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > android-v4/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.wxy.kaoyancountdown'
            compileSdk 35
            defaultConfig { applicationId 'com.wxy.kaoyancountdown'; minSdk 23; targetSdk 35; versionCode 4; versionName '1.3' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > android-v4/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <application android:allowBackup="true" android:hardwareAccelerated="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="考研倒计时" android:supportsRtl="true" android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true" android:resizeableActivity="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android-v4/app/src/main/java/com/wxy/kaoyancountdown/MainActivity.java <<'EOF'
          package com.wxy.kaoyancountdown;
          import android.app.Activity;import android.graphics.Color;import android.os.Bundle;import android.view.View;import android.view.Window;import android.view.WindowManager;import android.webkit.WebSettings;import android.webkit.WebView;import android.webkit.WebViewClient;
          public class MainActivity extends Activity{
            WebView w;
            public void onCreate(Bundle b){super.onCreate(b);requestWindowFeature(Window.FEATURE_NO_TITLE);getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);hide();w=new WebView(this);w.setBackgroundColor(Color.BLACK);w.setWebViewClient(new WebViewClient());WebSettings s=w.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setAllowFileAccess(true);s.setAllowContentAccess(true);s.setSupportZoom(false);setContentView(w);w.loadUrl("file:///android_asset/index.html");}
            void hide(){getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);}
            public void onWindowFocusChanged(boolean h){super.onWindowFocusChanged(h);if(h)hide();}
            protected void onResume(){super.onResume();hide();}
            protected void onDestroy(){if(w!=null){w.loadUrl("about:blank");w.stopLoading();w.destroy();}super.onDestroy();}
          }
          EOF
          cp kaoyan-countdown-v4/index.html android-v4/app/src/main/assets/index.html
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFilter
          import os,math
          root='android-v4/app/src/main/res'; sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          def icon(n):
            sc=n/512; im=Image.new('RGBA',(n,n)); p=im.load(); a=(8,10,14); b=(238,241,245); c=(8,10,14)
            for y in range(n):
              t=y/(n-1); u=t/.5 if t<.5 else (t-.5)/.5; x=tuple(int((a[i] if t<.5 else b[i])*(1-u)+(b[i] if t<.5 else c[i])*u) for i in range(3))
              for xx in range(n): p[xx,y]=x+(255,)
            glow=Image.new('RGBA',(n,n),(0,0,0,0));g=ImageDraw.Draw(glow);g.ellipse((-n*.10,n*.02,n*.82,n*.72),fill=(135,151,255,54));g.ellipse((n*.28,n*.30,n*1.05,n*1.03),fill=(107,235,215,36));glow=glow.filter(ImageFilter.GaussianBlur(max(3,int(26*sc))));im.alpha_composite(glow)
            d=ImageDraw.Draw(im);d.arc((-n*.09,n*.03,n*1.08,n*.82),195,337,fill=(184,195,255,220),width=max(3,int(16*sc)));d.arc((-n*.08,n*.42,n*.98,n*1.12),18,146,fill=(255,255,255,110),width=max(2,int(10*sc)))
            x0,y0,x1,y1=n*.25,n*.26,n*.75,n*.74;r=max(3,int(18*sc));d.rounded_rectangle((x0,y0,x1,y1),radius=r,fill=(255,255,255,18),outline=(255,255,255,85),width=max(1,int(3*sc)));d.line((x0+n*.03,(y0+y1)/2,x1-n*.03,(y0+y1)/2),fill=(255,255,255,76),width=max(1,int(2*sc)))
            d.rounded_rectangle((n*.32,n*.34,n*.48,n*.40),radius=max(1,int(5*sc)),fill=(255,255,255,240));d.rounded_rectangle((n*.53,n*.34,n*.68,n*.40),radius=max(1,int(5*sc)),fill=(255,255,255,185));d.rounded_rectangle((n*.32,n*.53,n*.48,n*.59),radius=max(1,int(5*sc)),fill=(255,255,255,170));d.rounded_rectangle((n*.53,n*.53,n*.68,n*.59),radius=max(1,int(5*sc)),fill=(255,255,255,125))
            mask=Image.new('L',(n,n),0);m=ImageDraw.Draw(mask);m.rounded_rectangle((0,0,n-1,n-1),radius=max(8,int(118*sc)),fill=255);out=Image.new('RGBA',(n,n),(0,0,0,0));out.paste(im,(0,0),mask);return out
          for den,n in sizes.items():
            i=icon(n);i.save(f'{root}/mipmap-{den}/ic_launcher.png');i.save(f'{root}/mipmap-{den}/ic_launcher_round.png')
          PY
      - name: Build signed debug APK
        working-directory: android-v4
        run: gradle assembleDebug
      - name: Verify APK
        run: |
          test -s android-v4/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android-v4/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/index.html|res/.*ic_launcher' || true
          cp android-v4/app/build/outputs/apk/debug/app-debug.apk KaoyanCountdown-v4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KaoyanCountdown-v4
          path: KaoyanCountdown-v4.apk
          retention-days: 7
