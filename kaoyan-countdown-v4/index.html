<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>考研倒计时</title>
<style>
:root{--fg:#f7f8fb;--soft:rgba(255,255,255,.58);--line:rgba(255,255,255,.12)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);display:grid;place-items:center;position:relative;isolation:isolate;background:linear-gradient(180deg,#040507 0%,#0b0d12 15%,#252932 30%,#d2d6dc 46%,#f3f5f7 50%,#d2d6dc 54%,#252932 70%,#0b0d12 85%,#040507 100%)}body:before{content:"";position:fixed;inset:-18%;z-index:-5;background:radial-gradient(circle at 14% 24%,rgba(125,141,255,.18),transparent 24%),radial-gradient(circle at 82% 30%,rgba(94,231,212,.13),transparent 25%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.10),transparent 26%);filter:blur(34px);animation:bgBreath 14s ease-in-out infinite alternate}.flow{position:fixed;inset:-7%;width:114%;height:114%;z-index:-3;pointer-events:none;opacity:.54;filter:drop-shadow(0 0 13px rgba(205,214,255,.16));animation:float 17s ease-in-out infinite alternate}.flow path{fill:none;stroke:rgba(255,255,255,.30);stroke-width:1.5;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:12 22 160 32;animation:dash 10s linear infinite}.flow path:nth-child(2){animation-duration:12s;stroke:rgba(193,203,255,.27)}.flow path:nth-child(3){animation-duration:14s;stroke:rgba(147,238,218,.21)}.flow path:nth-child(4){animation-duration:11s}.flow path:nth-child(5){animation-duration:15s;stroke:rgba(199,209,255,.23)}.glow{position:fixed;inset:-8%;width:116%;height:116%;z-index:-4;pointer-events:none;opacity:.42;filter:blur(18px);animation:float2 21s ease-in-out infinite alternate-reverse}.glow path{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:14 24 170 36;animation:dash 12s linear infinite reverse}.glow path:nth-child(odd){stroke:rgba(168,181,255,.22)}.glow path:nth-child(even){stroke:rgba(255,255,255,.18)}.noise{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.022;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}.panel{width:min(92vw,1180px);height:min(92vh,820px);padding:clamp(20px,3.2vmin,40px);border-radius:clamp(26px,3.4vmin,40px);display:grid;grid-template-rows:auto 1fr auto;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.15);background:linear-gradient(180deg,rgba(7,9,12,.78) 0%,rgba(16,18,23,.70) 18%,rgba(255,255,255,.14) 50%,rgba(16,18,23,.72) 82%,rgba(7,9,12,.82) 100%);backdrop-filter:blur(28px) saturate(125%);-webkit-backdrop-filter:blur(28px) saturate(125%);box-shadow:0 28px 90px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.10)}.panel:before{content:"";position:absolute;inset:-25%;background:radial-gradient(ellipse at 18% 20%,rgba(129,147,255,.13),transparent 28%),radial-gradient(ellipse at 82% 76%,rgba(112,235,216,.10),transparent 28%),radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.12),transparent 30%);filter:blur(24px);animation:bgBreath 15s ease-in-out infinite alternate-reverse}.top,.main,.foot{position:relative;z-index:1}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;font-size:clamp(11px,1.05vw,14px);letter-spacing:.14em;color:rgba(255,255,255,.72);font-weight:650}.mini{width:29px;height:29px;border-radius:10px;background:linear-gradient(180deg,#090c11,#eef1f5 50%,#090c11);border:1px solid rgba(255,255,255,.13);position:relative;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.16)}.mini:before{content:"";position:absolute;left:-4px;top:7px;width:36px;height:13px;border-top:2px solid rgba(176,188,255,.75);border-radius:50%}.mini:after{content:"";position:absolute;left:7px;right:7px;top:9px;bottom:7px;border:1px solid rgba(255,255,255,.65);border-radius:5px;background:rgba(255,255,255,.05)}.fs{appearance:none;border:0;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.55);display:grid;place-items:center}.fs svg{width:18px}.main{min-height:0;display:grid;align-content:center;justify-items:center;gap:clamp(23px,3.5vh,40px);transform:translateY(-.5vh)}.exam{text-align:center}.label{font-size:clamp(11px,1.08vw,15px);letter-spacing:.33em;color:rgba(255,255,255,.48);font-weight:650;margin-bottom:clamp(8px,1.4vh,14px)}.daysRow{display:flex;align-items:baseline;justify-content:center;gap:clamp(10px,1.2vw,18px);line-height:.9}#days{font-size:clamp(88px,min(16.5vw,21vh),230px);font-weight:760;letter-spacing:-.08em;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.98);text-shadow:0 10px 42px rgba(0,0,0,.12)}.unit{font-size:clamp(18px,2vw,28px);font-weight:650;letter-spacing:.16em;color:rgba(255,255,255,.50);transform:translateY(-.32em)}#detail{margin-top:clamp(11px,1.7vh,18px);font-size:clamp(12px,1.25vw,17px);letter-spacing:.10em;color:rgba(255,255,255,.58);font-variant-numeric:tabular-nums}.clockWrap{display:grid;justify-items:center;gap:clamp(10px,1.4vh,15px)}.clockTitle{font-size:clamp(10px,.9vw,13px);letter-spacing:.26em;color:rgba(255,255,255,.34);font-weight:650}.clock{display:flex;align-items:center;gap:clamp(7px,1vw,14px)}.pair{display:flex;gap:clamp(4px,.55vw,8px)}.digit{width:clamp(46px,min(6.4vw,9.6vh),82px);height:clamp(62px,min(8.8vw,13vh),112px);position:relative;perspective:1100px;border-radius:clamp(12px,1.1vw,16px);overflow:hidden;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.035) 45%,rgba(255,255,255,.08));box-shadow:0 16px 40px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.10)}.digit:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.30);box-shadow:0 -1px 0 rgba(255,255,255,.04);z-index:8}.half,.flap{position:absolute;left:0;width:100%;height:50%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}.half{display:flex;justify-content:center;font-weight:700;font-size:clamp(36px,min(5.2vw,7.9vh),67px);letter-spacing:-.05em;color:rgba(255,255,255,.95);font-variant-numeric:tabular-nums}.topHalf{top:0;align-items:center;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}.topHalf span{transform:translateY(26%)}.bottomHalf{bottom:0;align-items:flex-start;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.10))}.bottomHalf span{transform:translateY(-24%)}.flap{z-index:10;visibility:hidden;transform-style:preserve-3d}.flap span{position:absolute;inset:0;display:flex;justify-content:center;font-weight:700;font-size:clamp(36px,min(5.2vw,7.9vh),67px);letter-spacing:-.05em;color:rgba(255,255,255,.95)}.flapTop{top:0;transform-origin:bottom;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04))}.flapTop span{align-items:center;transform:translateY(26%)}.flapBottom{bottom:0;transform-origin:top;transform:rotateX(90deg);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.12))}.flapBottom span{align-items:flex-start;transform:translateY(-24%)}.digit.flipping .flap{visibility:visible}.digit.flipping .flapTop{animation:flipTop .38s cubic-bezier(.37,.01,.15,1) forwards}.digit.flipping .flapBottom{animation:flipBottom .38s cubic-bezier(.18,.7,.25,1) .38s forwards}.colon{display:grid;gap:clamp(8px,1.3vh,12px)}.colon:before,.colon:after{content:"";width:clamp(4px,.42vw,6px);height:clamp(4px,.42vw,6px);border-radius:50%;background:rgba(255,255,255,.44)}#date{font-size:clamp(11px,1vw,14px);letter-spacing:.11em;color:rgba(255,255,255,.52)}.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;font-size:clamp(9px,.78vw,11px);letter-spacing:.08em;color:rgba(255,255,255,.28)}.quote{justify-self:center;letter-spacing:.12em;color:rgba(255,255,255,.36)}.target{justify-self:end}@keyframes dash{to{stroke-dashoffset:-230}}@keyframes float{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(2%,-1.2%,0) scale(1.03)}}@keyframes float2{from{transform:translate3d(1%,-1%,0) scale(1.02)}to{transform:translate3d(-1.5%,1.4%,0) scale(1.05)}}@keyframes bgBreath{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,1.5%,0) scale(1.05)}}@keyframes flipTop{from{transform:rotateX(0);filter:brightness(1)}to{transform:rotateX(-90deg);filter:brightness(.84)}}@keyframes flipBottom{from{transform:rotateX(90deg);filter:brightness(.84)}to{transform:rotateX(0);filter:brightness(1)}}@media(max-width:760px){.panel{width:calc(100vw - 24px);height:calc(100vh - 24px);padding:20px 18px 18px;border-radius:25px}.foot{grid-template-columns:1fr auto}.spacer{display:none}.quote{justify-self:start}}@media(max-height:640px){.panel{width:calc(100vw - 18px);height:calc(100vh - 18px);padding:15px 22px 14px}.main{gap:12px;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<svg class="glow" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true"><path d="M-100 170C190-10 420 330 740 190S1290 20 1700 210"/><path d="M-110 300C170 110 470 440 800 310S1250 130 1700 365"/><path d="M-100 440C150 290 430 570 790 470S1270 280 1700 510"/><path d="M-90 585C160 410 450 710 800 625S1280 455 1700 670"/><path d="M-80 725C210 535 520 845 880 750S1320 625 1700 820"/></svg>
<svg class="flow" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true"><path d="M-100 170C190-10 420 330 740 190S1290 20 1700 210"/><path d="M-110 300C170 110 470 440 800 310S1250 130 1700 365"/><path d="M-100 440C150 290 430 570 790 470S1270 280 1700 510"/><path d="M-90 585C160 410 450 710 800 625S1280 455 1700 670"/><path d="M-80 725C210 535 520 845 880 750S1320 625 1700 820"/></svg>
<div class="noise"></div>
<main class="panel">
<header class="top"><div class="brand"><span class="mini"></span><span>FOCUS · 11408</span></div><button class="fs" id="fs" aria-label="全屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button></header>
<section class="main"><div class="exam"><div class="label">距离 2027 考研初试</div><div class="daysRow"><span id="days">--</span><span class="unit">天</span></div><div id="detail">-- 时 -- 分 -- 秒</div></div><div class="clockWrap"><div class="clockTitle">CURRENT TIME</div><div class="clock"><div class="pair"><div class="digit" id="h1"></div><div class="digit" id="h2"></div></div><div class="colon"></div><div class="pair"><div class="digit" id="m1"></div><div class="digit" id="m2"></div></div><div class="colon"></div><div class="pair"><div class="digit" id="s1"></div><div class="digit" id="s2"></div></div></div><div id="date">----</div></div></section>
<footer class="foot"><div class="spacer"></div><div class="quote">静下来 · 把今天学完</div><div class="target">暂按 2026.12.19 08:30</div></footer>
</main>
<script>
const EXAM=new Date('2026-12-19T08:30:00+08:00'),ids=['h1','h2','m1','m2','s1','s2'],state={};
const pad=n=>String(n).padStart(2,'0');
function html(v){return `<div class="half topHalf"><span>${v}</span></div><div class="half bottomHalf"><span>${v}</span></div><div class="flap flapTop"><span>${v}</span></div><div class="flap flapBottom"><span>${v}</span></div>`}
ids.forEach(id=>{document.getElementById(id).innerHTML=html('0');state[id]='0'});
function setDigit(id,n){const e=document.getElementById(id),o=state[id];if(o===n)return;const t=e.querySelector('.topHalf span'),b=e.querySelector('.bottomHalf span'),ft=e.querySelector('.flapTop span'),fb=e.querySelector('.flapBottom span');ft.textContent=o;fb.textContent=n;t.textContent=o;b.textContent=o;e.classList.remove('flipping');void e.offsetWidth;e.classList.add('flipping');clearTimeout(e.a);clearTimeout(e.b);e.a=setTimeout(()=>{t.textContent=n;b.textContent=n},380);e.b=setTimeout(()=>e.classList.remove('flipping'),780);state[id]=n}
function clock(now){const s=pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds());ids.forEach((id,i)=>setDigit(id,s[i]));const w=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];document.getElementById('date').textContent=`${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} · ${w[now.getDay()]}`}
function count(now){let d=EXAM-now;if(d<=0){days.textContent='0';detail.textContent='已经到达这一刻';return}const s=Math.floor(d/1000);days.textContent=Math.floor(s/86400);detail.textContent=`${pad(Math.floor((s%86400)/3600))} 时  ${pad(Math.floor((s%3600)/60))} 分  ${pad(s%60)} 秒`}
let sec=-1;function tick(){const n=new Date();count(n);if(n.getSeconds()!==sec){sec=n.getSeconds();clock(n)}}tick();setInterval(tick,150);
fs.onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){}};
</script>
</body></html>
