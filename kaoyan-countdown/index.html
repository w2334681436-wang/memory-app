<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0b0d" />
<title>考研倒计时 · Focus</title>
<style>
  :root {
    --bg: #0a0b0d;
    --panel: rgba(255,255,255,.055);
    --panel-2: rgba(255,255,255,.032);
    --line: rgba(255,255,255,.11);
    --text: #f5f6f7;
    --muted: rgba(245,246,247,.48);
    --soft: rgba(245,246,247,.72);
    --shadow: 0 22px 70px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
                 "SF Pro Display", "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Arial, sans-serif;
  }

  body {
    display: grid;
    place-items: center;
    position: relative;
    isolation: isolate;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: auto;
    pointer-events: none;
    z-index: -2;
    filter: blur(70px);
    opacity: .72;
  }

  body::before {
    width: 48vmax;
    height: 48vmax;
    left: -18vmax;
    top: -20vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(109,132,255,.17), transparent 65%);
  }

  body::after {
    width: 42vmax;
    height: 42vmax;
    right: -17vmax;
    bottom: -20vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(67,208,177,.105), transparent 68%);
  }

  .noise {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: .028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  }

  .app {
    width: min(92vw, 1180px);
    height: min(92vh, 820px);
    min-height: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: clamp(12px, 2.2vh, 24px);
    padding: clamp(20px, 3.3vmin, 40px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: clamp(24px, 3.3vmin, 38px);
    background:
      linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018)),
      rgba(10,11,13,.54);
    backdrop-filter: blur(24px) saturate(115%);
    -webkit-backdrop-filter: blur(24px) saturate(115%);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.06);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 32px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--soft);
    letter-spacing: .12em;
    font-size: clamp(11px, 1.05vw, 14px);
    font-weight: 600;
    text-transform: uppercase;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: #d9deff;
    box-shadow: 0 0 18px rgba(186,198,255,.8);
  }

  .fullscreen {
    appearance: none;
    border: 0;
    background: transparent;
    color: rgba(255,255,255,.42);
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .2s ease;
  }

  .fullscreen:hover {
    color: rgba(255,255,255,.86);
    background: rgba(255,255,255,.06);
  }

  .fullscreen svg { width: 18px; height: 18px; }

  .main {
    min-height: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: clamp(18px, 3vh, 34px);
    transform: translateY(-1.1vh);
  }

  .exam {
    text-align: center;
  }

  .eyebrow {
    margin-bottom: clamp(7px, 1.4vh, 12px);
    font-size: clamp(11px, 1.1vw, 15px);
    letter-spacing: .30em;
    color: var(--muted);
    font-weight: 600;
  }

  .days-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(10px, 1.3vw, 18px);
    line-height: .9;
  }

  #days {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    font-size: clamp(84px, min(16.5vw, 21vh), 228px);
    font-weight: 720;
    letter-spacing: -.075em;
    text-shadow: 0 3px 32px rgba(255,255,255,.035);
  }

  .days-unit {
    font-size: clamp(17px, 2vw, 28px);
    font-weight: 600;
    letter-spacing: .16em;
    color: rgba(255,255,255,.48);
    transform: translateY(-.34em);
  }

  .sub-countdown {
    margin-top: clamp(10px, 1.6vh, 16px);
    color: rgba(255,255,255,.48);
    font-size: clamp(12px, 1.25vw, 17px);
    letter-spacing: .085em;
    font-variant-numeric: tabular-nums;
  }

  .clock-wrap {
    width: min(100%, 760px);
    display: grid;
    gap: clamp(10px, 1.4vh, 14px);
    justify-items: center;
  }

  .clock-label {
    font-size: clamp(10px, .9vw, 13px);
    letter-spacing: .24em;
    color: rgba(255,255,255,.31);
    font-weight: 600;
  }

  .flip-clock {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(7px, 1vw, 14px);
  }

  .digit-pair {
    display: flex;
    gap: clamp(4px, .55vw, 8px);
  }

  .flip {
    width: clamp(43px, min(6.2vw, 9.4vh), 78px);
    height: clamp(58px, min(8.5vw, 12.8vh), 106px);
    position: relative;
    perspective: 700px;
    border-radius: clamp(10px, 1.1vw, 15px);
    background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.04));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 12px 35px rgba(0,0,0,.2);
    overflow: hidden;
  }

  .flip::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: rgba(0,0,0,.45);
    box-shadow: 0 -1px 0 rgba(255,255,255,.035);
    z-index: 4;
  }

  .flip .number,
  .flip .anim {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(35px, min(5.05vw, 7.7vh), 65px);
    font-weight: 650;
    letter-spacing: -.055em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .flip .number {
    color: rgba(255,255,255,.91);
  }

  .flip.change .number {
    animation: pulse .42s ease;
  }

  @keyframes pulse {
    0% { transform: translateY(-2px) scale(1.015); filter: brightness(1.35); }
    100% { transform: translateY(0) scale(1); filter: brightness(1); }
  }

  .colon {
    display: grid;
    gap: clamp(8px, 1.3vh, 12px);
    padding: 0 clamp(1px, .25vw, 4px);
  }

  .colon::before,
  .colon::after {
    content: "";
    width: clamp(4px, .42vw, 6px);
    height: clamp(4px, .42vw, 6px);
    border-radius: 50%;
    background: rgba(255,255,255,.38);
  }

  .date-line {
    margin-top: 1px;
    color: rgba(255,255,255,.46);
    font-size: clamp(11px, 1vw, 14px);
    letter-spacing: .1em;
  }

  .footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 14px;
    color: rgba(255,255,255,.26);
    font-size: clamp(9px, .78vw, 11px);
    letter-spacing: .06em;
  }

  .quote {
    justify-self: center;
    text-align: center;
    color: rgba(255,255,255,.34);
    letter-spacing: .12em;
    white-space: nowrap;
  }

  .target-note {
    justify-self: end;
    white-space: nowrap;
  }

  @media (max-width: 760px) {
    .app {
      width: calc(100vw - 24px);
      height: calc(100vh - 24px);
      padding: 20px 18px 18px;
      border-radius: 25px;
    }

    .main { transform: translateY(-.6vh); }
    .footer { grid-template-columns: 1fr auto; }
    .footer .spacer { display: none; }
    .quote { justify-self: start; }
  }

  @media (max-height: 640px) {
    .app {
      height: calc(100vh - 18px);
      width: calc(100vw - 18px);
      padding: 15px 22px 14px;
      gap: 8px;
    }
    .main { gap: 11px; transform: none; }
    .eyebrow { margin-bottom: 5px; }
    .sub-countdown { margin-top: 6px; }
    .clock-wrap { gap: 6px; }
    .footer { font-size: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="noise"></div>

  <main class="app" aria-label="考研倒计时">
    <header class="topbar">
      <div class="brand"><span class="dot"></span>FOCUS · 11408</div>
      <button class="fullscreen" id="fullscreenBtn" title="全屏 / 退出全屏" aria-label="切换全屏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
        </svg>
      </button>
    </header>

    <section class="main">
      <div class="exam">
        <div class="eyebrow">距离 2027 考研初试</div>
        <div class="days-row">
          <span id="days">--</span>
          <span class="days-unit">天</span>
        </div>
        <div class="sub-countdown" id="detailCountdown">-- 时 -- 分 -- 秒</div>
      </div>

      <div class="clock-wrap">
        <div class="clock-label">CURRENT TIME</div>
        <div class="flip-clock" aria-label="当前时间">
          <div class="digit-pair">
            <div class="flip"><div class="number" id="h1">0</div></div>
            <div class="flip"><div class="number" id="h2">0</div></div>
          </div>
          <div class="colon"></div>
          <div class="digit-pair">
            <div class="flip"><div class="number" id="m1">0</div></div>
            <div class="flip"><div class="number" id="m2">0</div></div>
          </div>
          <div class="colon"></div>
          <div class="digit-pair">
            <div class="flip"><div class="number" id="s1">0</div></div>
            <div class="flip"><div class="number" id="s2">0</div></div>
          </div>
        </div>
        <div class="date-line" id="dateLine">----</div>
      </div>
    </section>

    <footer class="footer">
      <div class="spacer"></div>
      <div class="quote">静下来 · 把今天学完</div>
      <div class="target-note">暂按 2026.12.19 08:30</div>
    </footer>
  </main>

<script>
  // ===== 唯一需要改的配置 =====
  // 教育部正式公布 2027 考研日期后，只需修改这一行。
  const EXAM_START = new Date('2026-12-19T08:30:00+08:00');

  const daysEl = document.getElementById('days');
  const detailEl = document.getElementById('detailCountdown');
  const dateLine = document.getElementById('dateLine');
  const digitIds = ['h1','h2','m1','m2','s1','s2'];
  const previous = {};

  function pad2(n) { return String(n).padStart(2, '0'); }

  function setDigit(id, value) {
    const el = document.getElementById(id);
    if (previous[id] === value) return;
    previous[id] = value;
    el.textContent = value;
    const card = el.parentElement;
    card.classList.remove('change');
    void card.offsetWidth;
    card.classList.add('change');
  }

  function updateClock(now) {
    const hh = pad2(now.getHours());
    const mm = pad2(now.getMinutes());
    const ss = pad2(now.getSeconds());
    const all = hh + mm + ss;
    digitIds.forEach((id, i) => setDigit(id, all[i]));

    const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const y = now.getFullYear();
    const m = pad2(now.getMonth() + 1);
    const d = pad2(now.getDate());
    dateLine.textContent = `${y}.${m}.${d}  ·  ${weekdays[now.getDay()]}`;
  }

  function updateCountdown(now) {
    let diff = EXAM_START.getTime() - now.getTime();
    if (diff <= 0) {
      daysEl.textContent = '0';
      detailEl.textContent = '已经到达这一刻';
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    daysEl.textContent = days;
    detailEl.textContent = `${pad2(hours)} 时  ${pad2(minutes)} 分  ${pad2(seconds)} 秒`;
  }

  function tick() {
    const now = new Date();
    updateClock(now);
    updateCountdown(now);
  }

  tick();
  setInterval(tick, 250);

  const fullscreenBtn = document.getElementById('fullscreenBtn');
  fullscreenBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (_) {}
  });

  // 双击空白处也可进入 / 退出全屏，更适合当桌面学习时钟。
  document.body.addEventListener('dblclick', async (e) => {
    if (e.target.closest('button')) return;
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {}
  });
</script>
</body>
</html>
