<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1114" />
<title>考研倒计时 · Focus</title>
<style>
  :root {
    --text: #f7f8fa;
    --soft: rgba(255,255,255,.76);
    --muted: rgba(255,255,255,.50);
    --faint: rgba(255,255,255,.28);
    --line: rgba(255,255,255,.12);
    --shadow: 0 30px 90px rgba(0,0,0,.22);
    --card-top: rgba(7,9,12,.72);
    --card-mid: rgba(255,255,255,.13);
    --card-bottom: rgba(7,9,12,.80);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
      "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    color: var(--text);
  }

  body {
    position: relative;
    display: grid;
    place-items: center;
    isolation: isolate;
    background:
      linear-gradient(180deg,
        #040507 0%,
        #0a0c10 14%,
        #22252d 28%,
        #cfd4db 46%,
        #eff2f5 50%,
        #cfd4db 54%,
        #20242b 72%,
        #0a0c10 86%,
        #040507 100%);
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: -15%;
    pointer-events: none;
    z-index: -5;
  }

  body::before {
    background:
      radial-gradient(circle at 18% 22%, rgba(113,129,255,.18), transparent 22%),
      radial-gradient(circle at 80% 28%, rgba(104,235,220,.16), transparent 24%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), transparent 26%);
    filter: blur(30px);
    animation: bgFloat 16s ease-in-out infinite alternate;
  }

  body::after {
    background:
      linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,.025) 12%,
        transparent 26%,
        rgba(255,255,255,.03) 44%,
        transparent 62%,
        rgba(255,255,255,.025) 82%,
        transparent 100%);
    transform: translateX(-8%);
    animation: sheen 12s ease-in-out infinite;
    mix-blend-mode: screen;
  }

  .flow-stage,
  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .flow-stage {
    z-index: -3;
    overflow: hidden;
  }

  .flow-lines,
  .flow-glow {
    position: absolute;
    inset: -8%;
    width: 116%;
    height: 116%;
  }

  .flow-lines {
    opacity: .50;
    animation: driftA 18s ease-in-out infinite alternate;
  }

  .flow-glow {
    filter: blur(16px);
    opacity: .38;
    animation: driftB 22s ease-in-out infinite alternate-reverse;
  }

  .flow-lines path,
  .flow-glow path {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    stroke-dasharray: 12 18 150 28;
  }

  .flow-lines path {
    stroke: rgba(255,255,255,.28);
    stroke-width: 1.45;
    animation: dashMove 10s linear infinite;
  }

  .flow-lines path:nth-child(2) { animation-duration: 12s; }
  .flow-lines path:nth-child(3) { animation-duration: 14s; }
  .flow-lines path:nth-child(4) { animation-duration: 11s; }
  .flow-lines path:nth-child(5) { animation-duration: 13s; }
  .flow-lines path:nth-child(6) { animation-duration: 16s; }

  .flow-glow path {
    stroke: rgba(182,194,255,.24);
    stroke-width: 6;
    animation: dashMove 11s linear infinite reverse;
  }

  .flow-glow path:nth-child(2),
  .flow-glow path:nth-child(5) { stroke: rgba(255,255,255,.18); }
  .flow-glow path:nth-child(3),
  .flow-glow path:nth-child(6) { stroke: rgba(114,232,214,.18); }

  .noise {
    z-index: -1;
    opacity: .024;
    mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  }

  .app {
    position: relative;
    z-index: 1;
    width: min(92vw, 1180px);
    height: min(92vh, 820px);
    min-height: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: clamp(12px, 2.2vh, 24px);
    padding: clamp(20px, 3.3vmin, 40px);
    border-radius: clamp(26px, 3.4vmin, 40px);
    border: 1px solid rgba(255,255,255,.14);
    background:
      linear-gradient(180deg,
        rgba(255,255,255,.08) 0%,
        rgba(255,255,255,.025) 10%,
        rgba(255,255,255,.008) 20%,
        transparent 30%),
      linear-gradient(180deg,
        var(--card-top) 0%,
        rgba(16,18,22,.70) 18%,
        var(--card-mid) 50%,
        rgba(16,18,22,.72) 82%,
        var(--card-bottom) 100%);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter: blur(28px) saturate(122%);
    -webkit-backdrop-filter: blur(28px) saturate(122%);
    overflow: hidden;
  }

  .app::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(ellipse at 18% 18%, rgba(124,145,255,.14), transparent 28%),
      radial-gradient(ellipse at 82% 76%, rgba(114,232,214,.12), transparent 26%),
      radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.12), transparent 30%);
    filter: blur(22px);
    animation: bgFloat 14s ease-in-out infinite alternate-reverse;
    z-index: 0;
  }

  .app::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(148deg, rgba(255,255,255,.08), transparent 22%, transparent 72%, rgba(255,255,255,.03));
    mix-blend-mode: screen;
    z-index: 0;
    pointer-events: none;
  }

  .topbar, .main, .footer {
    position: relative;
    z-index: 1;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 40px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--soft);
    letter-spacing: .13em;
    font-size: clamp(11px, 1.05vw, 14px);
    font-weight: 600;
    text-transform: uppercase;
  }

  .brand-badge {
    width: 28px;
    height: 28px;
    border-radius: 10px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, rgba(10,12,16,.94), rgba(236,239,243,.70) 50%, rgba(9,11,15,.95));
    box-shadow: 0 8px 26px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.12);
    overflow: hidden;
  }

  .brand-badge svg { width: 100%; height: 100%; display: block; }

  .brand strong {
    color: rgba(255,255,255,.94);
    font-weight: 650;
  }

  .fullscreen {
    appearance: none;
    border: 0;
    background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.54);
    width: 36px;
    height: 36px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .25s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }

  .fullscreen:hover {
    color: rgba(255,255,255,.94);
    background: rgba(255,255,255,.08);
  }

  .fullscreen svg { width: 18px; height: 18px; }

  .main {
    min-height: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: clamp(24px, 3.5vh, 40px);
    transform: translateY(-.45vh);
  }

  .exam { text-align: center; }

  .eyebrow {
    margin-bottom: clamp(8px, 1.4vh, 14px);
    font-size: clamp(11px, 1.08vw, 15px);
    letter-spacing: .33em;
    color: var(--muted);
    font-weight: 650;
  }

  .days-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(10px, 1.2vw, 18px);
    line-height: .9;
  }

  #days {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    font-size: clamp(88px, min(16.5vw, 21vh), 230px);
    font-weight: 760;
    letter-spacing: -.08em;
    color: rgba(255,255,255,.98);
    text-shadow: 0 0 28px rgba(255,255,255,.045), 0 10px 40px rgba(0,0,0,.12);
  }

  .days-unit {
    font-size: clamp(18px, 2vw, 28px);
    font-weight: 650;
    letter-spacing: .16em;
    color: rgba(255,255,255,.50);
    transform: translateY(-.32em);
  }

  .sub-countdown {
    margin-top: clamp(11px, 1.7vh, 18px);
    color: rgba(255,255,255,.58);
    font-size: clamp(12px, 1.25vw, 17px);
    letter-spacing: .10em;
    font-variant-numeric: tabular-nums;
  }

  .clock-wrap {
    width: min(100%, 790px);
    display: grid;
    gap: clamp(10px, 1.4vh, 15px);
    justify-items: center;
  }

  .clock-label {
    font-size: clamp(10px, .9vw, 13px);
    letter-spacing: .26em;
    color: rgba(255,255,255,.34);
    font-weight: 650;
  }

  .flip-clock {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(7px, 1vw, 14px);
  }

  .digit-pair {
    display: flex;
    gap: clamp(4px, .55vw, 8px);
  }

  .flip-unit {
    position: relative;
    width: clamp(46px, min(6.4vw, 9.6vh), 82px);
    height: clamp(62px, min(8.8vw, 13vh), 112px);
    perspective: 1100px;
    border-radius: clamp(12px, 1.1vw, 16px);
    box-shadow: 0 16px 40px rgba(0,0,0,.13), inset 0 1px 0 rgba(255,255,255,.10);
    background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04) 32%, rgba(255,255,255,.08));
    border: 1px solid rgba(255,255,255,.08);
    overflow: hidden;
  }

  .flip-unit::after {
    content: "";
    position: absolute;
    inset: 50% 0 auto;
    height: 1px;
    transform: translateY(-.5px);
    background: rgba(0,0,0,.30);
    box-shadow: 0 -1px 0 rgba(255,255,255,.04);
    z-index: 6;
  }

  .half,
  .flip-top,
  .flip-bottom {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .half {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: clamp(36px, min(5.2vw, 7.9vh), 67px);
    letter-spacing: -.05em;
    color: rgba(255,255,255,.95);
    text-shadow: 0 5px 14px rgba(0,0,0,.10);
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.02));
  }

  .half.top {
    top: 0;
    border-top-left-radius: inherit;
    border-top-right-radius: inherit;
  }

  .half.top .text { transform: translateY(26%); }

  .half.bottom {
    bottom: 0;
    align-items: flex-start;
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.10));
    border-bottom-left-radius: inherit;
    border-bottom-right-radius: inherit;
  }

  .half.bottom .text { transform: translateY(-24%); }

  .flip-top,
  .flip-bottom {
    z-index: 8;
    transform-style: preserve-3d;
    visibility: hidden;
  }

  .flip-top {
    top: 0;
    transform-origin: bottom;
    border-top-left-radius: inherit;
    border-top-right-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
  }

  .flip-top .text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: clamp(36px, min(5.2vw, 7.9vh), 67px);
    letter-spacing: -.05em;
    transform: translateY(26%);
    color: rgba(255,255,255,.95);
    text-shadow: 0 5px 14px rgba(0,0,0,.10);
  }

  .flip-bottom {
    bottom: 0;
    transform-origin: top;
    transform: rotateX(90deg);
    border-bottom-left-radius: inherit;
    border-bottom-right-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.12));
  }

  .flip-bottom .text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    font-weight: 700;
    font-size: clamp(36px, min(5.2vw, 7.9vh), 67px);
    letter-spacing: -.05em;
    transform: translateY(-24%);
    color: rgba(255,255,255,.95);
    text-shadow: 0 5px 14px rgba(0,0,0,.10);
  }

  .flip-unit.flipping .flip-top,
  .flip-unit.flipping .flip-bottom { visibility: visible; }

  .flip-unit.flipping .flip-top {
    animation: flipTop .42s cubic-bezier(.37,.01,.15,1) forwards;
  }

  .flip-unit.flipping .flip-bottom {
    animation: flipBottom .42s cubic-bezier(.18,.7,.25,1) .42s forwards;
  }

  @keyframes flipTop {
    0% { transform: rotateX(0deg); filter: brightness(1); }
    100% { transform: rotateX(-90deg); filter: brightness(.86); }
  }

  @keyframes flipBottom {
    0% { transform: rotateX(90deg); filter: brightness(.84); }
    100% { transform: rotateX(0deg); filter: brightness(1); }
  }

  .colon {
    display: grid;
    gap: clamp(8px, 1.3vh, 12px);
    padding: 0 clamp(1px, .25vw, 4px);
  }

  .colon::before,
  .colon::after {
    content: "";
    width: clamp(4px, .42vw, 6px);
    height: clamp(4px, .42vw, 6px);
    border-radius: 50%;
    background: rgba(255,255,255,.44);
    box-shadow: 0 0 12px rgba(255,255,255,.09);
  }

  .date-line {
    margin-top: 2px;
    color: rgba(255,255,255,.52);
    font-size: clamp(11px, 1vw, 14px);
    letter-spacing: .11em;
  }

  .footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 14px;
    color: rgba(255,255,255,.28);
    font-size: clamp(9px, .78vw, 11px);
    letter-spacing: .08em;
  }

  .quote {
    justify-self: center;
    text-align: center;
    color: rgba(255,255,255,.36);
    letter-spacing: .12em;
    white-space: nowrap;
  }

  .target-note {
    justify-self: end;
    white-space: nowrap;
  }

  @keyframes dashMove {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -220; }
  }

  @keyframes driftA {
    0% { transform: translate3d(-2%, 0, 0) scale(1); }
    100% { transform: translate3d(2%, -1.2%, 0) scale(1.03); }
  }

  @keyframes driftB {
    0% { transform: translate3d(1%, -1%, 0) scale(1.02); }
    100% { transform: translate3d(-1.5%, 1.4%, 0) scale(1.05); }
  }

  @keyframes bgFloat {
    0% { transform: translate3d(-2%, -1%, 0) scale(1); }
    100% { transform: translate3d(2%, 1.5%, 0) scale(1.05); }
  }

  @keyframes sheen {
    0%, 100% { opacity: .58; transform: translateX(-10%); }
    50% { opacity: .88; transform: translateX(10%); }
  }

  @media (max-width: 760px) {
    .app {
      width: calc(100vw - 24px);
      height: calc(100vh - 24px);
      padding: 20px 18px 18px;
      border-radius: 25px;
    }
    .main { transform: translateY(-.15vh); }
    .footer { grid-template-columns: 1fr auto; }
    .footer .spacer { display: none; }
    .quote { justify-self: start; }
  }

  @media (max-height: 640px) {
    .app {
      height: calc(100vh - 18px);
      width: calc(100vw - 18px);
      padding: 15px 22px 14px;
      gap: 8px;
    }
    .main { gap: 12px; transform: none; }
    .eyebrow { margin-bottom: 6px; }
    .sub-countdown { margin-top: 6px; }
    .clock-wrap { gap: 6px; }
    .footer { font-size: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="flow-stage" aria-hidden="true">
    <svg class="flow-glow" viewBox="0 0 1600 900" preserveAspectRatio="none">
      <path d="M-80 180 C 150 10, 390 340, 710 190 S 1280 20, 1680 220"/>
      <path d="M-100 290 C 180 110, 460 430, 760 300 S 1240 130, 1700 360"/>
      <path d="M-120 420 C 140 290, 420 560, 800 470 S 1280 260, 1690 500"/>
      <path d="M-120 560 C 150 390, 430 700, 770 620 S 1240 440, 1700 660"/>
      <path d="M-80 700 C 210 520, 520 840, 860 740 S 1290 620, 1700 820"/>
      <path d="M-60 90 C 220 -70, 600 220, 930 120 S 1310 -10, 1690 150"/>
    </svg>
    <svg class="flow-lines" viewBox="0 0 1600 900" preserveAspectRatio="none">
      <path d="M-80 180 C 150 10, 390 340, 710 190 S 1280 20, 1680 220"/>
      <path d="M-100 290 C 180 110, 460 430, 760 300 S 1240 130, 1700 360"/>
      <path d="M-120 420 C 140 290, 420 560, 800 470 S 1280 260, 1690 500"/>
      <path d="M-120 560 C 150 390, 430 700, 770 620 S 1240 440, 1700 660"/>
      <path d="M-80 700 C 210 520, 520 840, 860 740 S 1290 620, 1700 820"/>
      <path d="M-60 90 C 220 -70, 600 220, 930 120 S 1310 -10, 1690 150"/>
    </svg>
  </div>
  <div class="noise"></div>

  <main class="app" aria-label="考研倒计时">
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
            <defs>
              <linearGradient id="iconBg" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
                <stop stop-color="#090C11"/>
                <stop offset="0.50" stop-color="#EEF1F5"/>
                <stop offset="1" stop-color="#090C11"/>
              </linearGradient>
            </defs>
            <rect x="0.5" y="0.5" width="63" height="63" rx="18" fill="url(#iconBg)"/>
            <path d="M5 22C13 8 26 5 39 7C49 9 56 15 59 23" stroke="#AAB6FF" stroke-opacity="0.62" stroke-width="4" stroke-linecap="round"/>
            <path d="M6 46C18 34 30 37 39 42C46 46 52 48 58 47" stroke="white" stroke-opacity="0.36" stroke-width="3.5" stroke-linecap="round"/>
            <rect x="18" y="19" width="28" height="26" rx="8" fill="white" fill-opacity="0.08"/>
            <rect x="17.2" y="17.2" width="29.6" height="29.6" rx="9" stroke="white" stroke-opacity="0.22"/>
            <path d="M21 31.8H43" stroke="white" stroke-opacity="0.30" stroke-width="1.6"/>
            <path d="M25 23.5H39" stroke="white" stroke-opacity="0.92" stroke-width="3.6" stroke-linecap="round"/>
            <path d="M25 40.5H39" stroke="white" stroke-opacity="0.72" stroke-width="3.2" stroke-linecap="round"/>
            <rect x="0.5" y="0.5" width="63" height="63" rx="18" stroke="white" stroke-opacity="0.10"/>
          </svg>
        </span>
        <span><strong>FOCUS</strong> · 11408</span>
      </div>
      <button class="fullscreen" id="fullscreenBtn" title="全屏 / 退出全屏" aria-label="切换全屏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
        </svg>
      </button>
    </header>

    <section class="main">
      <div class="exam">
        <div class="eyebrow">距离 2027 考研初试</div>
        <div class="days-row">
          <span id="days">--</span>
          <span class="days-unit">天</span>
        </div>
        <div class="sub-countdown" id="detailCountdown">-- 时 -- 分 -- 秒</div>
      </div>

      <div class="clock-wrap">
        <div class="clock-label">CURRENT TIME</div>
        <div class="flip-clock" aria-label="当前时间">
          <div class="digit-pair">
            <div class="flip-unit" id="h1"></div>
            <div class="flip-unit" id="h2"></div>
          </div>
          <div class="colon"></div>
          <div class="digit-pair">
            <div class="flip-unit" id="m1"></div>
            <div class="flip-unit" id="m2"></div>
          </div>
          <div class="colon"></div>
          <div class="digit-pair">
            <div class="flip-unit" id="s1"></div>
            <div class="flip-unit" id="s2"></div>
          </div>
        </div>
        <div class="date-line" id="dateLine">----</div>
      </div>
    </section>

    <footer class="footer">
      <div class="spacer"></div>
      <div class="quote">静下来 · 把今天学完</div>
      <div class="target-note">暂按 2026.12.19 08:30</div>
    </footer>
  </main>

<script>
  const EXAM_START = new Date('2026-12-19T08:30:00+08:00');
  const daysEl = document.getElementById('days');
  const detailEl = document.getElementById('detailCountdown');
  const dateLine = document.getElementById('dateLine');
  const digitIds = ['h1','h2','m1','m2','s1','s2'];
  const digitState = {};

  function pad2(n) { return String(n).padStart(2, '0'); }

  function createFlipMarkup(value) {
    return `
      <div class="half top"><span class="text">${value}</span></div>
      <div class="half bottom"><span class="text">${value}</span></div>
      <div class="flip-top"><span class="text">${value}</span></div>
      <div class="flip-bottom"><span class="text">${value}</span></div>
    `;
  }

  function initDigits() {
    digitIds.forEach((id) => {
      const el = document.getElementById(id);
      el.innerHTML = createFlipMarkup('0');
      digitState[id] = '0';
    });
  }

  function setDigit(id, nextValue) {
    const el = document.getElementById(id);
    const currentValue = digitState[id];
    if (currentValue === nextValue) return;

    const staticTop = el.querySelector('.half.top .text');
    const staticBottom = el.querySelector('.half.bottom .text');
    const flipTop = el.querySelector('.flip-top .text');
    const flipBottom = el.querySelector('.flip-bottom .text');

    flipTop.textContent = currentValue;
    flipBottom.textContent = nextValue;
    staticTop.textContent = currentValue;
    staticBottom.textContent = currentValue;

    el.classList.remove('flipping');
    void el.offsetWidth;
    el.classList.add('flipping');

    clearTimeout(el._halfTimer);
    clearTimeout(el._doneTimer);

    el._halfTimer = setTimeout(() => {
      staticTop.textContent = nextValue;
      staticBottom.textContent = nextValue;
    }, 420);

    el._doneTimer = setTimeout(() => {
      el.classList.remove('flipping');
    }, 840);

    digitState[id] = nextValue;
  }

  function updateClock(now) {
    const hh = pad2(now.getHours());
    const mm = pad2(now.getMinutes());
    const ss = pad2(now.getSeconds());
    const all = hh + mm + ss;
    digitIds.forEach((id, i) => setDigit(id, all[i]));

    const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const y = now.getFullYear();
    const m = pad2(now.getMonth() + 1);
    const d = pad2(now.getDate());
    dateLine.textContent = `${y}.${m}.${d}  ·  ${weekdays[now.getDay()]}`;
  }

  function updateCountdown(now) {
    const diff = EXAM_START.getTime() - now.getTime();
    if (diff <= 0) {
      daysEl.textContent = '0';
      detailEl.textContent = '已经到达这一刻';
      return;
    }
    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    daysEl.textContent = days;
    detailEl.textContent = `${pad2(hours)} 时  ${pad2(minutes)} 分  ${pad2(seconds)} 秒`;
  }

  let lastSecond = -1;
  function tick() {
    const now = new Date();
    updateCountdown(now);
    if (now.getSeconds() !== lastSecond) {
      lastSecond = now.getSeconds();
      updateClock(now);
    }
  }

  initDigits();
  tick();
  setInterval(tick, 150);

  const fullscreenBtn = document.getElementById('fullscreenBtn');
  fullscreenBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {}
  });

  document.body.addEventListener('dblclick', async (e) => {
    if (e.target.closest('button')) return;
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {}
  });
</script>
</body>
</html>
